name: Training

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: Why this training run is being launched
        required: false
        default: manual_dispatch
      profile:
        description: Training profile to run
        required: false
        default: quick

concurrency:
  group: remote-training
  cancel-in-progress: false

jobs:
  train-and-register:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT_NAME: ${{ secrets.MLFLOW_EXPERIMENT_NAME || 'churn_prediction' }}
      TRAINING_PROFILE: ${{ github.event.inputs.profile || vars.TRAINING_PROFILE || 'quick' }}
      TRAINING_REASON: ${{ github.event.inputs.reason || 'scheduled_weekly_retraining' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "MLFLOW_TRACKING_URI is not configured."
            echo "This workflow requires an externally reachable MLflow service."
            exit 1
          fi

      - name: Check MLflow reachability
        run: |
          python -c "import os, urllib.request; urllib.request.urlopen(os.environ['MLFLOW_TRACKING_URI'], timeout=20); print('MLflow reachable')"

      - name: Run training pipeline
        run: |
          python Scripts/run_training.py --reason "$TRAINING_REASON" --profile "$TRAINING_PROFILE"

      - name: Upload trained bundles
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-bundles
          path: |
            models/churn_production_bundle.pkl
            churn_production.pkl
          if-no-files-found: warn

      - name: Write workflow summary
        run: |
          {
            echo "## Remote Training Summary"
            echo ""
            echo "- Reason: \`$TRAINING_REASON\`"
            echo "- Profile: \`$TRAINING_PROFILE\`"
            echo "- MLflow URI: \`$MLFLOW_TRACKING_URI\`"
          } >> "$GITHUB_STEP_SUMMARY"
