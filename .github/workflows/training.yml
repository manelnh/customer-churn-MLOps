name: Training

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: Why this training run is being launched
        required: false
        default: manual_dispatch

jobs:
  train-and-register:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ secrets.MLFLOW_TRACKING_URI != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled training pipeline
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: ${{ secrets.MLFLOW_EXPERIMENT_NAME || 'churn_prediction' }}
        run: |
          python Scripts/run_training.py --reason "${{ github.event.inputs.reason || 'scheduled_run' }}"

      - name: Upload trained bundles
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-bundles
          path: |
            models/churn_production_bundle.pkl
            churn_production.pkl
          if-no-files-found: warn
